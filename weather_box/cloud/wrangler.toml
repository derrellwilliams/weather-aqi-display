# The deployed name is private (it becomes the public URL), so it lives in the
# gitignored .worker-name file. Deploy with `npm run deploy`, not `wrangler deploy`.
name = "fridge-display"
main = "src/index.js"
compatibility_date = "2025-10-01"

# 30-minute cache so PurpleAir points aren't wasted.
[[kv_namespaces]]
binding = "CACHE"
id = "7be0b34db48e4e9caaec94bc582076f1"
